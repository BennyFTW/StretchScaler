name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: call build.bat < nul

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\StretchScaler.exe dist\
          Copy-Item README.md, LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath StretchScaler.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StretchScaler-${{ github.sha }}
          path: StretchScaler.zip

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StretchScaler.zip
          generate_release_notes: true
